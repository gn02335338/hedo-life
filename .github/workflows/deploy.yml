name: Deploy to Cloudflare
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
    environment:
      name: production
      url: https://hedo-life.bvstudio.workers.dev
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
        timeout-minutes: 5
      - name: Run tests before deployment
        run: npm test
        timeout-minutes: 25
      - name: Deploy with the locked Wrangler CLI
        run: npm run deploy
        timeout-minutes: 10
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Summarize successful deployment
        if: success()
        env:
          GAME_URL: https://hedo-life.bvstudio.workers.dev
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            printf '## Deployment successful\n\n'
            printf -- '- Game: [移動人生](%s)\n' "$GAME_URL"
            printf -- '- Commit: [%s](%s)\n' "$COMMIT_SHA" "$COMMIT_URL"
            printf -- '- Workflow: [View deployment run](%s)\n' "$RUN_URL"
          } >> "$GITHUB_STEP_SUMMARY"
