name: Publish player feedback

on:
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows: ['Deploy to Cloudflare']
    types: [completed]
    branches: [main]

permissions:
  contents: read
  issues: write
  id-token: write

concurrency:
  group: feedback-publisher
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'gn02335338/hedo-life' && github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconcile and publish queued feedback
        run: node scripts/publish-feedback.mjs
        env:
          FEEDBACK_BASE_URL: https://hedo-life.bvstudio.workers.dev
          FEEDBACK_AUDIENCE: https://hedo-life.bvstudio.workers.dev/api/feedback-publisher
          FEEDBACK_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
