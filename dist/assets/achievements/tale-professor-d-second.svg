<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" role="img" aria-labelledby="tale-professor-d-second-title tale-professor-d-second-desc" data-art-version="66"><title id="tale-professor-d-second-title">林老師｜攔住他快速講完，回去再憑記憶補…</title><desc id="tale-professor-d-second-desc">在「最後一題，只需要再借教授三小時」這一幕，明確選擇「攔住他快速講完，回去再憑記憶補細節」。教授回答到一半就得離開，你帶回幾個關鍵詞，卻不知道各自適用哪個條件。大家都有聽過答案，仍沒人能照答案做事。</desc><rect width="240" height="200" rx="28" fill="#f1f8f5"/><circle cx="120" cy="98" r="76" fill="#d1e9df"/><path d="M35 172q85 14 170 0" fill="none" stroke="#629780" opacity=".55" stroke-width="4" stroke-linecap="round"/><g stroke="#293044" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"><g transform="rotate(4 111 101)"><g transform="translate(111 101) scale(0.92)"><path d="M0-28q-18-16-43-7v72q25-9 43 7 18-16 43-7v-72Q18-44 0-28z" fill="#fffaf4"/><path d="M0-28v72m-31-61 20 5m-20 12 20 5m22-5 20-5m-20-12 20-5" fill="none"/></g></g><circle cx="179" cy="142" r="28" fill="#f1f8f5" stroke="#629780" stroke-width="2.5"/><g transform="translate(179 142) scale(0.38)"><path d="M0-28q-18-16-43-7v72q25-9 43 7 18-16 43-7v-72Q18-44 0-28z" fill="#fffaf4"/><path d="M0-28v72m-31-61 20 5m-20 12 20 5m22-5 20-5m-20-12 20-5" fill="none"/></g><g transform="translate(49 143) scale(0.3)"><rect x="-39" y="-37" width="78" height="80" rx="8" fill="#fffaf4"/><path d="M-39-14h78m-59-35v24m40-24v24M-23 1h13m8 0h13m8 0h8M-23 17h13m8 0h13m8 0h8M-23 32h13m8 0h13" fill="none"/></g></g><g fill="#79b69f"><circle cx="176" cy="42" r="4"/><circle cx="188" cy="42" r="4"/></g><path d="M205 85h10m-5-5v10M26 116h10" fill="none" stroke="#79b69f" stroke-width="3" stroke-linecap="round"/></svg>
