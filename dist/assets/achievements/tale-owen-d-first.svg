<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" role="img" aria-labelledby="tale-owen-d-first-title tale-owen-d-first-desc" data-art-version="66"><title id="tale-owen-d-first-title">歐文｜分開核對餘額與這次訂單，保留個…</title><desc id="tale-owen-d-first-desc">在「追到一杯飲料，連甜度都不能選」這一幕，明確選擇「分開核對餘額與這次訂單，保留個人選項」。歐文收到明確的使用紀錄，大家也能選自己喝得下的那杯。獎勵不再只是端出一個統一答案，而是把事情交代清楚。</desc><rect width="240" height="200" rx="28" fill="#f3f1fb"/><circle cx="120" cy="98" r="76" fill="#ded9ef"/><path d="M35 172q85 14 170 0" fill="none" stroke="#80719e" opacity=".55" stroke-width="4" stroke-linecap="round"/><g stroke="#293044" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"><g transform="rotate(0 111 101)"><g transform="translate(111 101) scale(0.92)"><path d="M-32-28h64l-8 73h-48z" fill="#9e89bf"/><path d="M-37-39h74v13h-74z" fill="#fffaf4"/><path d="m9-52-4 61M-23 7h44" fill="none"/></g></g><circle cx="179" cy="142" r="28" fill="#f3f1fb" stroke="#80719e" stroke-width="2.5"/><g transform="translate(179 142) scale(0.38)"><path d="M0-28q-18-16-43-7v72q25-9 43 7 18-16 43-7v-72Q18-44 0-28z" fill="#fffaf4"/><path d="M0-28v72m-31-61 20 5m-20 12 20 5m22-5 20-5m-20-12 20-5" fill="none"/></g><g transform="translate(49 143) scale(0.3)"><rect x="-39" y="-37" width="78" height="80" rx="8" fill="#fffaf4"/><path d="M-39-14h78m-59-35v24m40-24v24M-23 1h13m8 0h13m8 0h8M-23 17h13m8 0h13m8 0h8M-23 32h13m8 0h13" fill="none"/></g></g><g fill="#9e89bf"><circle cx="176" cy="42" r="4"/></g><path d="M205 85h10m-5-5v10M26 116h10" fill="none" stroke="#9e89bf" stroke-width="3" stroke-linecap="round"/></svg>
