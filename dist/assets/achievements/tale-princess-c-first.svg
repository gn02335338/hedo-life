<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" role="img" aria-labelledby="tale-princess-c-first-title tale-princess-c-first-desc" data-art-version="66"><title id="tale-princess-c-first-title">公主｜請當事人確認實際測試與通過標準…</title><desc id="tale-princess-c-first-desc">在「多倫多四個字，測試還是紅的」這一幕，明確選擇「請當事人確認實際測試與通過標準，以可重現的失敗紀錄為準」。你沒有替實際測試與通過標準猜答案，先把可重現的失敗紀錄確認好。公主帶走可處理的一項，剩下的仍列待確認，沒有一起塞回你口袋。</desc><rect width="240" height="200" rx="28" fill="#eef7fb"/><circle cx="120" cy="98" r="76" fill="#d2e6ef"/><path d="M35 172q85 14 170 0" fill="none" stroke="#5b899d" opacity=".55" stroke-width="4" stroke-linecap="round"/><g stroke="#293044" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"><g transform="rotate(0 111 101)"><g transform="translate(111 101) scale(0.92)"><rect x="-36" y="-35" width="72" height="56" rx="4" fill="#fffaf4"/><path d="M-36 21h72l14 15q0 8-9 8h-82q-9 0-9-8z" fill="#73a9bc"/><path d="M-23-20h45m-45 14h27m-27 14h39" fill="none"/></g></g><circle cx="179" cy="142" r="28" fill="#eef7fb" stroke="#5b899d" stroke-width="2.5"/><g transform="translate(179 142) scale(0.38)"><path d="M0-28q-18-16-43-7v72q25-9 43 7 18-16 43-7v-72Q18-44 0-28z" fill="#fffaf4"/><path d="M0-28v72m-31-61 20 5m-20 12 20 5m22-5 20-5m-20-12 20-5" fill="none"/></g><g transform="translate(49 143) scale(0.3)"><path d="M-31-44h62v88l-10-6-10 6-11-6-11 6-10-6-10 6z" fill="#fffaf4"/><path d="M-19-27h38m-38 13h22m-22 17h38m-38 14h22" fill="none"/></g></g><g fill="#73a9bc"><circle cx="176" cy="42" r="4"/><circle cx="188" cy="42" r="4"/></g><path d="M205 85h10m-5-5v10M26 116h10" fill="none" stroke="#73a9bc" stroke-width="3" stroke-linecap="round"/></svg>
