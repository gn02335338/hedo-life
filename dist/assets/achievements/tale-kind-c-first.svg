<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" role="img" aria-labelledby="tale-kind-c-first-title tale-kind-c-first-desc" data-art-version="66"><title id="tale-kind-c-first-title">阿良｜讓每人自行確認出席，沒有回覆就…</title><desc id="tale-kind-c-first-desc">在「群組十五個好，不一定有十五個人」這一幕，明確選擇「讓每人自行確認出席，沒有回覆就不替他訂位」。阿良的名字留在待確認，你按真實人數找地方。群組少了一點熱鬧，現場也少了一張永遠等不到人的椅子。</desc><rect width="240" height="200" rx="28" fill="#f3f1fb"/><circle cx="120" cy="98" r="76" fill="#ded9ef"/><path d="M35 172q85 14 170 0" fill="none" stroke="#80719e" opacity=".55" stroke-width="4" stroke-linecap="round"/><g stroke="#293044" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"><g transform="rotate(0 111 101)"><g transform="translate(111 101) scale(0.92)"><path d="M-32-28h64l-8 73h-48z" fill="#9e89bf"/><path d="M-37-39h74v13h-74z" fill="#fffaf4"/><path d="m9-52-4 61M-23 7h44" fill="none"/></g></g><circle cx="179" cy="142" r="28" fill="#f3f1fb" stroke="#80719e" stroke-width="2.5"/><g transform="translate(179 142) scale(0.38)"><path d="M0-28q-18-16-43-7v72q25-9 43 7 18-16 43-7v-72Q18-44 0-28z" fill="#fffaf4"/><path d="M0-28v72m-31-61 20 5m-20 12 20 5m22-5 20-5m-20-12 20-5" fill="none"/></g><g transform="translate(49 143) scale(0.3)"><rect x="-39" y="-37" width="78" height="80" rx="8" fill="#fffaf4"/><path d="M-39-14h78m-59-35v24m40-24v24M-23 1h13m8 0h13m8 0h8M-23 17h13m8 0h13m8 0h8M-23 32h13m8 0h13" fill="none"/></g></g><g fill="#9e89bf"><circle cx="176" cy="42" r="4"/></g><path d="M205 85h10m-5-5v10M26 116h10" fill="none" stroke="#9e89bf" stroke-width="3" stroke-linecap="round"/></svg>
