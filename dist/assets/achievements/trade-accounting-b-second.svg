<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" role="img" aria-labelledby="trade-accounting-b-second-title trade-accounting-b-second-desc" data-art-version="66"><title id="trade-accounting-b-second-title">會計專員｜先承諾今天交，關帳和新分類一起…</title><desc id="trade-accounting-b-second-desc">在「今天關帳，需求剛好今天才想起來」這一幕，明確選擇「先承諾今天交，關帳和新分類一起做」。翅膀說會計就是要有彈性。你一邊核憑證一邊搬欄位，晚餐變成兩個表格中間的幾口冷飯。</desc><rect width="240" height="200" rx="28" fill="#fff3ec"/><circle cx="120" cy="98" r="76" fill="#f2dac8"/><path d="M35 172q85 14 170 0" fill="none" stroke="#a77c60" opacity=".55" stroke-width="4" stroke-linecap="round"/><g stroke="#293044" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"><g transform="rotate(0 111 101)"><g transform="translate(111 101) scale(0.92)"><rect x="-43" y="-28" width="86" height="64" rx="9" fill="#ce9670"/><path d="M-35-28v-12l64-7v19" fill="#fffaf4"/><path d="M17-10h31v28H17q-12-14 0-28z" fill="#fffaf4"/><circle cx="30" cy="4" r="3" stroke="none" fill="#293044"/></g></g><circle cx="179" cy="142" r="28" fill="#fff3ec" stroke="#a77c60" stroke-width="2.5"/><g transform="translate(179 142) scale(0.38)"><path d="M-16-39v-13h32v13" fill="none"/><rect x="-33" y="-39" width="66" height="85" rx="9" fill="#fffaf4"/><path d="M-33-16h66" fill="none"/><circle cy="5" r="11" fill="#ce9670"/><path d="M-19 33q2-17 19-17t19 17" fill="#ce9670"/></g><g transform="translate(49 143) scale(0.3)"><rect x="-39" y="-37" width="78" height="80" rx="8" fill="#fffaf4"/><path d="M-39-14h78m-59-35v24m40-24v24M-23 1h13m8 0h13m8 0h8M-23 17h13m8 0h13m8 0h8M-23 32h13m8 0h13" fill="none"/></g></g><g fill="#ce9670"><circle cx="176" cy="42" r="4"/><circle cx="188" cy="42" r="4"/><circle cx="200" cy="42" r="4"/></g><path d="M205 85h10m-5-5v10M26 116h10" fill="none" stroke="#ce9670" stroke-width="3" stroke-linecap="round"/></svg>
