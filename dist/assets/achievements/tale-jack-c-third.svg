<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" role="img" aria-labelledby="tale-jack-c-third-title tale-jack-c-third-desc" data-art-version="66"><title id="tale-jack-c-third-title">傑克｜替會議開一張住院單，診斷是反覆…</title><desc id="tale-jack-c-third-desc">在「研發部經理，兼任記憶體」這一幕，明確選擇「替會議開一張住院單，診斷是反覆失憶」。傑克笑著收下，提醒你病歷也要寫日期。你們在玩笑旁補齊真正的決議；這篇還沒取好標題，下一場會議已經開始提供續集。</desc><rect width="240" height="200" rx="28" fill="#f3f1fb"/><circle cx="120" cy="98" r="76" fill="#ded9ef"/><path d="M35 172q85 14 170 0" fill="none" stroke="#80719e" opacity=".55" stroke-width="4" stroke-linecap="round"/><g stroke="#293044" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"><g transform="rotate(-4 111 101)"><g transform="translate(111 101) scale(0.92)"><rect x="-43" y="-38" width="86" height="63" rx="4" fill="#fffaf4"/><path d="M-20 25v24m40-24v24M-29 8l18-17 17 6 22-22" fill="none" stroke="#9e89bf"/><path d="M20-25h8v9" fill="none"/></g></g><circle cx="179" cy="142" r="28" fill="#f3f1fb" stroke="#80719e" stroke-width="2.5"/><g transform="translate(179 142) scale(0.38)"><path d="M0-28q-18-16-43-7v72q25-9 43 7 18-16 43-7v-72Q18-44 0-28z" fill="#fffaf4"/><path d="M0-28v72m-31-61 20 5m-20 12 20 5m22-5 20-5m-20-12 20-5" fill="none"/></g><g transform="translate(49 143) scale(0.3)"><rect x="-39" y="-37" width="78" height="80" rx="8" fill="#fffaf4"/><path d="M-39-14h78m-59-35v24m40-24v24M-23 1h13m8 0h13m8 0h8M-23 17h13m8 0h13m8 0h8M-23 32h13m8 0h13" fill="none"/></g></g><g fill="#9e89bf"><circle cx="176" cy="42" r="4"/></g><path d="M205 85h10m-5-5v10M26 116h10" fill="none" stroke="#9e89bf" stroke-width="3" stroke-linecap="round"/></svg>
