<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" role="img" aria-labelledby="tale-janet-b-first-title tale-janet-b-first-desc" data-art-version="66"><title id="tale-janet-b-first-title">Janet｜只問現在已付還是未付，請她把答…</title><desc id="tale-janet-b-first-desc">在「說明已發送，意思恕不附贈」這一幕，明確選擇「只問現在已付還是未付，請她把答案補進同一封信」。Janet說你把事情問得太死，你仍等那個付款狀態。最後她補了一行目前未付、尚待確認；沒有什麼神奇的新進度，只是十二個人終於不必替同一句話各寫一篇解讀。</desc><rect width="240" height="200" rx="28" fill="#fff3f7"/><circle cx="120" cy="98" r="76" fill="#f5d5e2"/><path d="M35 172q85 14 170 0" fill="none" stroke="#b36e8b" opacity=".55" stroke-width="4" stroke-linecap="round"/><g stroke="#293044" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"><g transform="rotate(0 111 101)"><g transform="translate(111 101) scale(0.92)"><path d="M-44-25v-14h34l12 14h43v66h-89z" fill="#e76c9a"/><path d="M-31-21h61v46h-61z" fill="#fffaf4"/><path d="M-44-6h99L40 47h-88z" fill="#e76c9a"/></g></g><circle cx="179" cy="142" r="28" fill="#fff3f7" stroke="#b36e8b" stroke-width="2.5"/><g transform="translate(179 142) scale(0.38)"><path d="M0-28q-18-16-43-7v72q25-9 43 7 18-16 43-7v-72Q18-44 0-28z" fill="#fffaf4"/><path d="M0-28v72m-31-61 20 5m-20 12 20 5m22-5 20-5m-20-12 20-5" fill="none"/></g><g transform="translate(49 143) scale(0.3)"><path d="M-31-44h62v88l-10-6-10 6-11-6-11 6-10-6-10 6z" fill="#fffaf4"/><path d="M-19-27h38m-38 13h22m-22 17h38m-38 14h22" fill="none"/></g></g><g fill="#e76c9a"><circle cx="176" cy="42" r="4"/></g><path d="M205 85h10m-5-5v10M26 116h10" fill="none" stroke="#e76c9a" stroke-width="3" stroke-linecap="round"/></svg>
