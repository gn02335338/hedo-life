<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" role="img" aria-labelledby="trade-sales-a-first-title trade-sales-a-first-desc" data-art-version="66"><title id="trade-sales-a-first-title">業務｜按問題類型標窗口，保留一條升級…</title><desc id="trade-sales-a-first-desc">在「群組有總監，不能把每件事都送總監」這一幕，明確選擇「按問題類型標窗口，保留一條升級管道」。前女友把付款問題轉給正確部門，產品問題也附上實際畫面。訊息少繞一圈，沒有人得先扮演萬用總機才能開始工作。</desc><rect width="240" height="200" rx="28" fill="#f1f8f5"/><circle cx="120" cy="98" r="76" fill="#d1e9df"/><path d="M35 172q85 14 170 0" fill="none" stroke="#629780" opacity=".55" stroke-width="4" stroke-linecap="round"/><g stroke="#293044" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"><g transform="rotate(-8 111 101)"><g transform="translate(111 101) scale(0.92)"><rect x="-43" y="-28" width="86" height="64" rx="9" fill="#79b69f"/><path d="M-35-28v-12l64-7v19" fill="#fffaf4"/><path d="M17-10h31v28H17q-12-14 0-28z" fill="#fffaf4"/><circle cx="30" cy="4" r="3" stroke="none" fill="#293044"/></g></g><circle cx="179" cy="142" r="28" fill="#f1f8f5" stroke="#629780" stroke-width="2.5"/><g transform="translate(179 142) scale(0.38)"><path d="M-16-39v-13h32v13" fill="none"/><rect x="-33" y="-39" width="66" height="85" rx="9" fill="#fffaf4"/><path d="M-33-16h66" fill="none"/><circle cy="5" r="11" fill="#79b69f"/><path d="M-19 33q2-17 19-17t19 17" fill="#79b69f"/></g><g transform="translate(49 143) scale(0.3)"><rect x="-39" y="-37" width="78" height="80" rx="8" fill="#fffaf4"/><path d="M-39-14h78m-59-35v24m40-24v24M-23 1h13m8 0h13m8 0h8M-23 17h13m8 0h13m8 0h8M-23 32h13m8 0h13" fill="none"/></g></g><g fill="#79b69f"><circle cx="176" cy="42" r="4"/><circle cx="188" cy="42" r="4"/></g><path d="M205 85h10m-5-5v10M26 116h10" fill="none" stroke="#79b69f" stroke-width="3" stroke-linecap="round"/></svg>
