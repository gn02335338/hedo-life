<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" role="img" aria-labelledby="tale-wing-b-second-title tale-wing-b-second-desc" data-art-version="66"><title id="tale-wing-b-second-title">翅膀｜先修最明顯的字，再列出待確認處…</title><desc id="tale-wing-b-second-desc">在「AI 寫完了，人工請開始收尾」這一幕，明確選擇「先修最明顯的字，再列出待確認處」。主管說括號太多，氣勢會斷。你想產品缺的地方也不少，只是現在先由括號負責誠實。</desc><rect width="240" height="200" rx="28" fill="#fff3ec"/><circle cx="120" cy="98" r="76" fill="#f2dac8"/><path d="M35 172q85 14 170 0" fill="none" stroke="#a77c60" opacity=".55" stroke-width="4" stroke-linecap="round"/><g stroke="#293044" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"><g transform="rotate(-4 111 101)"><g transform="translate(111 101) scale(0.92)"><path d="M37-31q-38-35-72 3-29 35 10 63 23 14 39-1-12-17 1-20 27 3 22-24z" fill="#fffaf4"/><circle cx="-23" cy="-9" r="6" fill="#ce9670"/><circle cx="-6" cy="-25" r="6" fill="#ce9670"/><circle cx="16" cy="-22" r="6" fill="#ce9670"/><circle cx="-22" cy="15" r="6" fill="#ce9670"/></g></g><circle cx="179" cy="142" r="28" fill="#fff3ec" stroke="#a77c60" stroke-width="2.5"/><g transform="translate(179 142) scale(0.38)"><path d="M0-28q-18-16-43-7v72q25-9 43 7 18-16 43-7v-72Q18-44 0-28z" fill="#fffaf4"/><path d="M0-28v72m-31-61 20 5m-20 12 20 5m22-5 20-5m-20-12 20-5" fill="none"/></g><g transform="translate(49 143) scale(0.3)"><rect x="-39" y="-37" width="78" height="80" rx="8" fill="#fffaf4"/><path d="M-39-14h78m-59-35v24m40-24v24M-23 1h13m8 0h13m8 0h8M-23 17h13m8 0h13m8 0h8M-23 32h13m8 0h13" fill="none"/></g></g><g fill="#ce9670"><circle cx="176" cy="42" r="4"/><circle cx="188" cy="42" r="4"/><circle cx="200" cy="42" r="4"/></g><path d="M205 85h10m-5-5v10M26 116h10" fill="none" stroke="#ce9670" stroke-width="3" stroke-linecap="round"/></svg>
