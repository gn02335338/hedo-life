<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" role="img" aria-labelledby="trade-system-d-third-title trade-system-d-third-desc" data-art-version="66"><title id="trade-system-d-third-title">系統工程師｜替人名安裝下班按鈕，沒有文件的…</title><desc id="trade-system-d-third-desc">在「交接不是把人留在群組裡」這一幕，明確選擇「替人名安裝下班按鈕，沒有文件的問題不得無限重試」。按鈕沒有接線，交接表卻補上操作步驟。公主仍能協助，不必再用一個在線狀態代替整份文件。</desc><rect width="240" height="200" rx="28" fill="#fff3f7"/><circle cx="120" cy="98" r="76" fill="#f5d5e2"/><path d="M35 172q85 14 170 0" fill="none" stroke="#b36e8b" opacity=".55" stroke-width="4" stroke-linecap="round"/><g stroke="#293044" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"><g transform="rotate(0 111 101)"><g transform="translate(111 101) scale(0.92)"><rect x="-36" y="-35" width="72" height="56" rx="4" fill="#fffaf4"/><path d="M-36 21h72l14 15q0 8-9 8h-82q-9 0-9-8z" fill="#e76c9a"/><path d="M-23-20h45m-45 14h27m-27 14h39" fill="none"/></g></g><circle cx="179" cy="142" r="28" fill="#fff3f7" stroke="#b36e8b" stroke-width="2.5"/><g transform="translate(179 142) scale(0.38)"><path d="M-16-39v-13h32v13" fill="none"/><rect x="-33" y="-39" width="66" height="85" rx="9" fill="#fffaf4"/><path d="M-33-16h66" fill="none"/><circle cy="5" r="11" fill="#e76c9a"/><path d="M-19 33q2-17 19-17t19 17" fill="#e76c9a"/></g><g transform="translate(49 143) scale(0.3)"><path d="M-31-44h62v88l-10-6-10 6-11-6-11 6-10-6-10 6z" fill="#fffaf4"/><path d="M-19-27h38m-38 13h22m-22 17h38m-38 14h22" fill="none"/></g></g><g fill="#e76c9a"><circle cx="176" cy="42" r="4"/></g><path d="M205 85h10m-5-5v10M26 116h10" fill="none" stroke="#e76c9a" stroke-width="3" stroke-linecap="round"/></svg>
