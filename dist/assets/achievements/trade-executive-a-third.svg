<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" role="img" aria-labelledby="trade-executive-a-third-title trade-executive-a-third-desc" data-art-version="66"><title id="trade-executive-a-third-title">高階主管｜替方向申請駕照，沒過預算考試不…</title><desc id="trade-executive-a-third-desc">在「董事長提個方向，議案誰來簽」這一幕，明確選擇「替方向申請駕照，沒過預算考試不得開上排程高速公路」。屎潘蛇問考題是什麼，你寫出成本、負責人與停止條件。方向沒有熄火，只是終於有人踩了煞車確認路況。</desc><rect width="240" height="200" rx="28" fill="#fff8e5"/><circle cx="120" cy="98" r="76" fill="#f0e1b0"/><path d="M35 172q85 14 170 0" fill="none" stroke="#a88942" opacity=".55" stroke-width="4" stroke-linecap="round"/><g stroke="#293044" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"><g transform="rotate(-8 111 101)"><g transform="translate(111 101) scale(0.92)"><rect x="-43" y="-28" width="86" height="64" rx="9" fill="#d4ae56"/><path d="M-35-28v-12l64-7v19" fill="#fffaf4"/><path d="M17-10h31v28H17q-12-14 0-28z" fill="#fffaf4"/><circle cx="30" cy="4" r="3" stroke="none" fill="#293044"/></g></g><circle cx="179" cy="142" r="28" fill="#fff8e5" stroke="#a88942" stroke-width="2.5"/><g transform="translate(179 142) scale(0.38)"><path d="M-16-39v-13h32v13" fill="none"/><rect x="-33" y="-39" width="66" height="85" rx="9" fill="#fffaf4"/><path d="M-33-16h66" fill="none"/><circle cy="5" r="11" fill="#d4ae56"/><path d="M-19 33q2-17 19-17t19 17" fill="#d4ae56"/></g><g transform="translate(49 143) scale(0.3)"><path d="M-31-44h62v88l-10-6-10 6-11-6-11 6-10-6-10 6z" fill="#fffaf4"/><path d="M-19-27h38m-38 13h22m-22 17h38m-38 14h22" fill="none"/></g></g><g fill="#d4ae56"><circle cx="176" cy="42" r="4"/><circle cx="188" cy="42" r="4"/><circle cx="200" cy="42" r="4"/></g><path d="M205 85h10m-5-5v10M26 116h10" fill="none" stroke="#d4ae56" stroke-width="3" stroke-linecap="round"/></svg>
