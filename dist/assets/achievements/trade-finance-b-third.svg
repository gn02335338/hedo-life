<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" role="img" aria-labelledby="trade-finance-b-third-title trade-finance-b-third-desc" data-art-version="66"><title id="trade-finance-b-third-title">財務專員｜拿玩具鐘當收款機，每敲一下就問…</title><desc id="trade-finance-b-third-desc">在「敲鐘簡報，現金流先不要打拍子」這一幕，明確選擇「拿玩具鐘當收款機，每敲一下就問一次銀行有沒有進帳」。玩具鐘敲得很熱鬧，銀行不為所動。Janet把樂觀、一般和延後情境分開，簡報仍能談未來，付款安排開始看今天真的有什麼。</desc><rect width="240" height="200" rx="28" fill="#f3f1fb"/><circle cx="120" cy="98" r="76" fill="#ded9ef"/><path d="M35 172q85 14 170 0" fill="none" stroke="#80719e" opacity=".55" stroke-width="4" stroke-linecap="round"/><g stroke="#293044" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"><g transform="rotate(4 111 101)"><g transform="translate(111 101) scale(0.92)"><rect x="-43" y="-28" width="86" height="64" rx="9" fill="#9e89bf"/><path d="M-35-28v-12l64-7v19" fill="#fffaf4"/><path d="M17-10h31v28H17q-12-14 0-28z" fill="#fffaf4"/><circle cx="30" cy="4" r="3" stroke="none" fill="#293044"/></g></g><circle cx="179" cy="142" r="28" fill="#f3f1fb" stroke="#80719e" stroke-width="2.5"/><g transform="translate(179 142) scale(0.38)"><path d="M-16-39v-13h32v13" fill="none"/><rect x="-33" y="-39" width="66" height="85" rx="9" fill="#fffaf4"/><path d="M-33-16h66" fill="none"/><circle cy="5" r="11" fill="#9e89bf"/><path d="M-19 33q2-17 19-17t19 17" fill="#9e89bf"/></g><g transform="translate(49 143) scale(0.3)"><rect x="-39" y="-37" width="78" height="80" rx="8" fill="#fffaf4"/><path d="M-39-14h78m-59-35v24m40-24v24M-23 1h13m8 0h13m8 0h8M-23 17h13m8 0h13m8 0h8M-23 32h13m8 0h13" fill="none"/></g></g><g fill="#9e89bf"><circle cx="176" cy="42" r="4"/></g><path d="M205 85h10m-5-5v10M26 116h10" fill="none" stroke="#9e89bf" stroke-width="3" stroke-linecap="round"/></svg>
