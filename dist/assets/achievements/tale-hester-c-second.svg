<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" role="img" aria-labelledby="tale-hester-c-second-title tale-hester-c-second-desc" data-art-version="66"><title id="tale-hester-c-second-title">海姐｜先給一個很近的日期，之後再調整…</title><desc id="tale-hester-c-second-desc">在「新事業要有窗口，不能只有同學。」這一幕，明確選擇「先給一個很近的日期，之後再調整」。那個日期很快被轉寄出去。等需求回來，大家已把它當成曾經同意的時間，你只好多寫一封更長的更正信。</desc><rect width="240" height="200" rx="28" fill="#fff3f7"/><circle cx="120" cy="98" r="76" fill="#f5d5e2"/><path d="M35 172q85 14 170 0" fill="none" stroke="#b36e8b" opacity=".55" stroke-width="4" stroke-linecap="round"/><g stroke="#293044" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"><g transform="rotate(0 111 101)"><g transform="translate(111 101) scale(0.92)"><path d="M-44-25v-14h34l12 14h43v66h-89z" fill="#e76c9a"/><path d="M-31-21h61v46h-61z" fill="#fffaf4"/><path d="M-44-6h99L40 47h-88z" fill="#e76c9a"/></g></g><circle cx="179" cy="142" r="28" fill="#fff3f7" stroke="#b36e8b" stroke-width="2.5"/><g transform="translate(179 142) scale(0.38)"><path d="M0-28q-18-16-43-7v72q25-9 43 7 18-16 43-7v-72Q18-44 0-28z" fill="#fffaf4"/><path d="M0-28v72m-31-61 20 5m-20 12 20 5m22-5 20-5m-20-12 20-5" fill="none"/></g><g transform="translate(49 143) scale(0.3)"><path d="M-31-44h62v88l-10-6-10 6-11-6-11 6-10-6-10 6z" fill="#fffaf4"/><path d="M-19-27h38m-38 13h22m-22 17h38m-38 14h22" fill="none"/></g></g><g fill="#e76c9a"><circle cx="176" cy="42" r="4"/></g><path d="M205 85h10m-5-5v10M26 116h10" fill="none" stroke="#e76c9a" stroke-width="3" stroke-linecap="round"/></svg>
