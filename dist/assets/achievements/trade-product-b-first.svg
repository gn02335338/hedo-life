<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" role="img" aria-labelledby="trade-product-b-first-title trade-product-b-first-desc" data-art-version="66"><title id="trade-product-b-first-title">產品經理｜補上停用條件、操作步驟與代理人…</title><desc id="trade-product-b-first-desc">在「功能上線以前，先找下線的開關」這一幕，明確選擇「補上停用條件、操作步驟與代理人」。前女友請另一位同事照著操作一遍，確認真的能停。你們沒有多加一個產品亮點，卻留住了發生問題時能做事的餘地。</desc><rect width="240" height="200" rx="28" fill="#fff3ec"/><circle cx="120" cy="98" r="76" fill="#f2dac8"/><path d="M35 172q85 14 170 0" fill="none" stroke="#a77c60" opacity=".55" stroke-width="4" stroke-linecap="round"/><g stroke="#293044" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"><g transform="rotate(-8 111 101)"><g transform="translate(111 101) scale(0.92)"><rect x="-36" y="-35" width="72" height="56" rx="4" fill="#fffaf4"/><path d="M-36 21h72l14 15q0 8-9 8h-82q-9 0-9-8z" fill="#ce9670"/><path d="M-23-20h45m-45 14h27m-27 14h39" fill="none"/></g></g><circle cx="179" cy="142" r="28" fill="#fff3ec" stroke="#a77c60" stroke-width="2.5"/><g transform="translate(179 142) scale(0.38)"><path d="M-16-39v-13h32v13" fill="none"/><rect x="-33" y="-39" width="66" height="85" rx="9" fill="#fffaf4"/><path d="M-33-16h66" fill="none"/><circle cy="5" r="11" fill="#ce9670"/><path d="M-19 33q2-17 19-17t19 17" fill="#ce9670"/></g><g transform="translate(49 143) scale(0.3)"><rect x="-39" y="-37" width="78" height="80" rx="8" fill="#fffaf4"/><path d="M-39-14h78m-59-35v24m40-24v24M-23 1h13m8 0h13m8 0h8M-23 17h13m8 0h13m8 0h8M-23 32h13m8 0h13" fill="none"/></g></g><g fill="#ce9670"><circle cx="176" cy="42" r="4"/><circle cx="188" cy="42" r="4"/><circle cx="200" cy="42" r="4"/></g><path d="M205 85h10m-5-5v10M26 116h10" fill="none" stroke="#ce9670" stroke-width="3" stroke-linecap="round"/></svg>
