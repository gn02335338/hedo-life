<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" role="img" aria-labelledby="trade-design-a-third-title trade-design-a-third-desc" data-art-version="66"><title id="trade-design-a-third-title">產品設計｜替每張名片裝版本履歷，交換前先…</title><desc id="trade-design-a-third-desc">在「名片的兩個字，比字級還敏感」這一幕，明確選擇「替每張名片裝版本履歷，交換前先朗讀更新紀錄」。屎潘蛇說名片不用那麼複雜，你順勢請他確認最終稱謂。更新紀錄沒有印上去，確認紀錄倒是留下了。</desc><rect width="240" height="200" rx="28" fill="#eef7fb"/><circle cx="120" cy="98" r="76" fill="#d2e6ef"/><path d="M35 172q85 14 170 0" fill="none" stroke="#5b899d" opacity=".55" stroke-width="4" stroke-linecap="round"/><g stroke="#293044" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"><g transform="rotate(-4 111 101)"><g transform="translate(111 101) scale(0.92)"><path d="M37-31q-38-35-72 3-29 35 10 63 23 14 39-1-12-17 1-20 27 3 22-24z" fill="#fffaf4"/><circle cx="-23" cy="-9" r="6" fill="#73a9bc"/><circle cx="-6" cy="-25" r="6" fill="#73a9bc"/><circle cx="16" cy="-22" r="6" fill="#73a9bc"/><circle cx="-22" cy="15" r="6" fill="#73a9bc"/></g></g><circle cx="179" cy="142" r="28" fill="#eef7fb" stroke="#5b899d" stroke-width="2.5"/><g transform="translate(179 142) scale(0.38)"><path d="M-16-39v-13h32v13" fill="none"/><rect x="-33" y="-39" width="66" height="85" rx="9" fill="#fffaf4"/><path d="M-33-16h66" fill="none"/><circle cy="5" r="11" fill="#73a9bc"/><path d="M-19 33q2-17 19-17t19 17" fill="#73a9bc"/></g><g transform="translate(49 143) scale(0.3)"><path d="M-31-44h62v88l-10-6-10 6-11-6-11 6-10-6-10 6z" fill="#fffaf4"/><path d="M-19-27h38m-38 13h22m-22 17h38m-38 14h22" fill="none"/></g></g><g fill="#73a9bc"><circle cx="176" cy="42" r="4"/><circle cx="188" cy="42" r="4"/></g><path d="M205 85h10m-5-5v10M26 116h10" fill="none" stroke="#73a9bc" stroke-width="3" stroke-linecap="round"/></svg>
