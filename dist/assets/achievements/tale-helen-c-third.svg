<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" role="img" aria-labelledby="tale-helen-c-third-title tale-helen-c-third-desc" data-art-version="66"><title id="tale-helen-c-third-title">前女友｜替截止線聘請門神，晚到的便當願…</title><desc id="tale-helen-c-third-desc">在「幫大家張羅，名單永遠有人晚一口氣」這一幕，明確選擇「替截止線聘請門神，晚到的便當願望先排下一班車」。前女友把下一班車寫成下次截止時間，大家笑著接受。門神沒有領薪水，訂餐的人倒是終於能準時吃飯。</desc><rect width="240" height="200" rx="28" fill="#eef7fb"/><circle cx="120" cy="98" r="76" fill="#d2e6ef"/><path d="M35 172q85 14 170 0" fill="none" stroke="#5b899d" opacity=".55" stroke-width="4" stroke-linecap="round"/><g stroke="#293044" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"><g transform="rotate(-8 111 101)"><g transform="translate(111 101) scale(0.92)"><path d="M-32-28h64l-8 73h-48z" fill="#73a9bc"/><path d="M-37-39h74v13h-74z" fill="#fffaf4"/><path d="m9-52-4 61M-23 7h44" fill="none"/></g></g><circle cx="179" cy="142" r="28" fill="#eef7fb" stroke="#5b899d" stroke-width="2.5"/><g transform="translate(179 142) scale(0.38)"><path d="M0-28q-18-16-43-7v72q25-9 43 7 18-16 43-7v-72Q18-44 0-28z" fill="#fffaf4"/><path d="M0-28v72m-31-61 20 5m-20 12 20 5m22-5 20-5m-20-12 20-5" fill="none"/></g><g transform="translate(49 143) scale(0.3)"><path d="M-31-44h62v88l-10-6-10 6-11-6-11 6-10-6-10 6z" fill="#fffaf4"/><path d="M-19-27h38m-38 13h22m-22 17h38m-38 14h22" fill="none"/></g></g><g fill="#73a9bc"><circle cx="176" cy="42" r="4"/><circle cx="188" cy="42" r="4"/></g><path d="M205 85h10m-5-5v10M26 116h10" fill="none" stroke="#73a9bc" stroke-width="3" stroke-linecap="round"/></svg>
