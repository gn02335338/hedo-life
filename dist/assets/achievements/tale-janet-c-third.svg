<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" role="img" aria-labelledby="tale-janet-c-third-title tale-janet-c-third-desc" data-art-version="66"><title id="tale-janet-c-third-title">Janet｜替印表機裝體溫計，每次態度降溫…</title><desc id="tale-janet-c-third-desc">在「同一個故障，兩種服務溫度」這一幕，明確選擇「替印表機裝體溫計，每次態度降溫就自動印出排隊號碼」。體溫計沒有接上驅動程式，兩張工單倒是排到同一套順序。Janet等你一起確認列印，阿福今天不能只用語氣當處理進度。</desc><rect width="240" height="200" rx="28" fill="#fff3f7"/><circle cx="120" cy="98" r="76" fill="#f5d5e2"/><path d="M35 172q85 14 170 0" fill="none" stroke="#b36e8b" opacity=".55" stroke-width="4" stroke-linecap="round"/><g stroke="#293044" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"><g transform="rotate(-8 111 101)"><g transform="translate(111 101) scale(0.92)"><path d="M37-31q-38-35-72 3-29 35 10 63 23 14 39-1-12-17 1-20 27 3 22-24z" fill="#fffaf4"/><circle cx="-23" cy="-9" r="6" fill="#e76c9a"/><circle cx="-6" cy="-25" r="6" fill="#e76c9a"/><circle cx="16" cy="-22" r="6" fill="#e76c9a"/><circle cx="-22" cy="15" r="6" fill="#e76c9a"/></g></g><circle cx="179" cy="142" r="28" fill="#fff3f7" stroke="#b36e8b" stroke-width="2.5"/><g transform="translate(179 142) scale(0.38)"><path d="M0-28q-18-16-43-7v72q25-9 43 7 18-16 43-7v-72Q18-44 0-28z" fill="#fffaf4"/><path d="M0-28v72m-31-61 20 5m-20 12 20 5m22-5 20-5m-20-12 20-5" fill="none"/></g><g transform="translate(49 143) scale(0.3)"><path d="M-31-44h62v88l-10-6-10 6-11-6-11 6-10-6-10 6z" fill="#fffaf4"/><path d="M-19-27h38m-38 13h22m-22 17h38m-38 14h22" fill="none"/></g></g><g fill="#e76c9a"><circle cx="176" cy="42" r="4"/></g><path d="M205 85h10m-5-5v10M26 116h10" fill="none" stroke="#e76c9a" stroke-width="3" stroke-linecap="round"/></svg>
