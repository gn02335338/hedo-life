<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" role="img" aria-labelledby="tale-janet-c-first-title tale-janet-c-first-desc" data-art-version="66"><title id="tale-janet-c-first-title">Janet｜把報修優先級與等待順序說清楚，…</title><desc id="tale-janet-c-first-desc">在「同一個故障，兩種服務溫度」這一幕，明確選擇「把報修優先級與等待順序說清楚，留下相同標準的工單紀錄」。你和Janet把報修優先級與等待順序逐項對起來，相同標準的工單紀錄留在共同紀錄。事情沒有憑空變少，至少下一次不用從誰記得哪一句重新開始。</desc><rect width="240" height="200" rx="28" fill="#f3f1fb"/><circle cx="120" cy="98" r="76" fill="#ded9ef"/><path d="M35 172q85 14 170 0" fill="none" stroke="#80719e" opacity=".55" stroke-width="4" stroke-linecap="round"/><g stroke="#293044" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"><g transform="rotate(8 111 101)"><g transform="translate(111 101) scale(0.92)"><path d="M37-31q-38-35-72 3-29 35 10 63 23 14 39-1-12-17 1-20 27 3 22-24z" fill="#fffaf4"/><circle cx="-23" cy="-9" r="6" fill="#9e89bf"/><circle cx="-6" cy="-25" r="6" fill="#9e89bf"/><circle cx="16" cy="-22" r="6" fill="#9e89bf"/><circle cx="-22" cy="15" r="6" fill="#9e89bf"/></g></g><circle cx="179" cy="142" r="28" fill="#f3f1fb" stroke="#80719e" stroke-width="2.5"/><g transform="translate(179 142) scale(0.38)"><path d="M0-28q-18-16-43-7v72q25-9 43 7 18-16 43-7v-72Q18-44 0-28z" fill="#fffaf4"/><path d="M0-28v72m-31-61 20 5m-20 12 20 5m22-5 20-5m-20-12 20-5" fill="none"/></g><g transform="translate(49 143) scale(0.3)"><rect x="-39" y="-37" width="78" height="80" rx="8" fill="#fffaf4"/><path d="M-39-14h78m-59-35v24m40-24v24M-23 1h13m8 0h13m8 0h8M-23 17h13m8 0h13m8 0h8M-23 32h13m8 0h13" fill="none"/></g></g><g fill="#9e89bf"><circle cx="176" cy="42" r="4"/></g><path d="M205 85h10m-5-5v10M26 116h10" fill="none" stroke="#9e89bf" stroke-width="3" stroke-linecap="round"/></svg>
