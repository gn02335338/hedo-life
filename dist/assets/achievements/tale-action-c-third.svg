<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" role="img" aria-labelledby="tale-action-c-third-title tale-action-c-third-desc" data-art-version="66"><title id="tale-action-c-third-title">順哥｜把同學錄當規格書送審，請每位同…</title><desc id="tale-action-c-third-desc">在「同學一句話，專案多一段。」這一幕，明確選擇「把同學錄當規格書送審，請每位同學各簽一個需求」。順哥說不用這麼正式，海姐卻真的拿筆圈了兩個問題。你把同學錄收回包裡，留下能執行的那張紙。</desc><rect width="240" height="200" rx="28" fill="#fff3f7"/><circle cx="120" cy="98" r="76" fill="#f5d5e2"/><path d="M35 172q85 14 170 0" fill="none" stroke="#b36e8b" opacity=".55" stroke-width="4" stroke-linecap="round"/><g stroke="#293044" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"><g transform="rotate(-4 111 101)"><g transform="translate(111 101) scale(0.92)"><rect x="-43" y="-38" width="86" height="63" rx="4" fill="#fffaf4"/><path d="M-20 25v24m40-24v24M-29 8l18-17 17 6 22-22" fill="none" stroke="#e76c9a"/><path d="M20-25h8v9" fill="none"/></g></g><circle cx="179" cy="142" r="28" fill="#fff3f7" stroke="#b36e8b" stroke-width="2.5"/><g transform="translate(179 142) scale(0.38)"><path d="M0-28q-18-16-43-7v72q25-9 43 7 18-16 43-7v-72Q18-44 0-28z" fill="#fffaf4"/><path d="M0-28v72m-31-61 20 5m-20 12 20 5m22-5 20-5m-20-12 20-5" fill="none"/></g><g transform="translate(49 143) scale(0.3)"><path d="M-31-44h62v88l-10-6-10 6-11-6-11 6-10-6-10 6z" fill="#fffaf4"/><path d="M-19-27h38m-38 13h22m-22 17h38m-38 14h22" fill="none"/></g></g><g fill="#e76c9a"><circle cx="176" cy="42" r="4"/></g><path d="M205 85h10m-5-5v10M26 116h10" fill="none" stroke="#e76c9a" stroke-width="3" stroke-linecap="round"/></svg>
