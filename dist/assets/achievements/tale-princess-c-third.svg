<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" role="img" aria-labelledby="tale-princess-c-third-title tale-princess-c-third-desc" data-art-version="66"><title id="tale-princess-c-third-title">公主｜把校名放進測試執行器，看它願不…</title><desc id="tale-princess-c-third-desc">在「多倫多四個字，測試還是紅的」這一幕，明確選擇「把校名放進測試執行器，看它願不願意自己修錯」。校名沒有參與執行，你們照錯誤逐項處理。公主少被介紹一次，程式多過一項真正的檢查。</desc><rect width="240" height="200" rx="28" fill="#f1f8f5"/><circle cx="120" cy="98" r="76" fill="#d1e9df"/><path d="M35 172q85 14 170 0" fill="none" stroke="#629780" opacity=".55" stroke-width="4" stroke-linecap="round"/><g stroke="#293044" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"><g transform="rotate(0 111 101)"><g transform="translate(111 101) scale(0.92)"><rect x="-36" y="-35" width="72" height="56" rx="4" fill="#fffaf4"/><path d="M-36 21h72l14 15q0 8-9 8h-82q-9 0-9-8z" fill="#79b69f"/><path d="M-23-20h45m-45 14h27m-27 14h39" fill="none"/></g></g><circle cx="179" cy="142" r="28" fill="#f1f8f5" stroke="#629780" stroke-width="2.5"/><g transform="translate(179 142) scale(0.38)"><path d="M0-28q-18-16-43-7v72q25-9 43 7 18-16 43-7v-72Q18-44 0-28z" fill="#fffaf4"/><path d="M0-28v72m-31-61 20 5m-20 12 20 5m22-5 20-5m-20-12 20-5" fill="none"/></g><g transform="translate(49 143) scale(0.3)"><rect x="-39" y="-37" width="78" height="80" rx="8" fill="#fffaf4"/><path d="M-39-14h78m-59-35v24m40-24v24M-23 1h13m8 0h13m8 0h8M-23 17h13m8 0h13m8 0h8M-23 32h13m8 0h13" fill="none"/></g></g><g fill="#79b69f"><circle cx="176" cy="42" r="4"/><circle cx="188" cy="42" r="4"/></g><path d="M205 85h10m-5-5v10M26 116h10" fill="none" stroke="#79b69f" stroke-width="3" stroke-linecap="round"/></svg>
